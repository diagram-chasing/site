backend:
  name: github
  repo: diagram-chasing/website
  skip_ci: true
media_folder: "src/content/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "Posts"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: true,
        }
      - {
          label: "Base URL",
          name: "base_url",
          widget: "string",
          required: false,
        }
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - {
          label: "Published",
          name: "published",
          widget: "boolean",
          default: true,
        }
      - {
          label: "Featured Image",
          name: "image",
          widget: "image",
          required: true,
        }
      - {
          label: "Gallery Images",
          name: "gallery",
          widget: "list",
          required: false,
          max: 4,
          field: { label: "Image", name: "image", widget: "image" },
          hint: "Optional additional images for the project (max 4)",
        }
      - {
          label: "Type",
          name: "type",
          widget: "select",
          options: ["interactive", "article", "stories"],
          required: true,
        }
      - { label: "Date", name: "date", widget: "datetime", required: true }
      - {
          label: "Tags",
          name: "tags",
          widget: "list",
          allow_add: true,
          field: { label: "Tag", name: "tag", widget: "string" },
        }
      - {
          label: "Authors",
          name: "authors",
          widget: "list",
          allow_add: true,
          field: { label: "Author Slug", name: "author", widget: "string" },
        }
      - {
          label: "Code Repository",
          name: "code",
          widget: "string",
          required: false,
        }
      - {
          label: "External Project",
          name: "external",
          widget: "boolean",
          default: false,
          hint: "Check if this project links to an external site instead of an internal page",
        }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "authors"
    label: "Authors"
    folder: "src/content/authors"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "name", widget: "string", required: true }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: true,
        }
      - { label: "Slug", name: "slug", widget: "string", required: true }
      - { label: "Image", name: "image", widget: "image", required: false }
      - {
          label: "Links",
          name: "links",
          widget: "object",
          required: false,
          fields:
            [
              {
                label: "Email",
                name: "email",
                widget: "string",
                required: false,
              },
              {
                label: "GitHub",
                name: "github",
                widget: "string",
                required: false,
              },
              {
                label: "Twitter",
                name: "twitter",
                widget: "string",
                required: false,
              },
              {
                label: "Bluesky",
                name: "bluesky",
                widget: "string",
                required: false,
              },
              {
                label: "Website",
                name: "website",
                widget: "string",
                required: false,
              },
              {
                label: "Instagram",
                name: "instagram",
                widget: "string",
                required: false,
              },
            ],
        }

  - name: "news"
    label: "news & Mentions"
    files:
      - name: "news"
        label: "news Items"
        file: "src/content/news.md"
        format: "frontmatter"
        fields:
          - {
              label: "Title",
              name: "title",
              widget: "string",
              default: "news & Mentions",
            }
          - {
              label: "news",
              name: "news",
              widget: "list",
              fields:
                [
                  { label: "Title", name: "title", widget: "string" },
                  { label: "Source", name: "source", widget: "string" },
                  { label: "URL", name: "url", widget: "string" },
                  {
                    label: "Date",
                    name: "date",
                    widget: "datetime",
                    type: "date",
                    format: "YYYY-MM-DD",
                  },
                  {
                    label: "Type",
                    name: "type",
                    widget: "select",
                    options: ["news", "talk"],
                    default: "news",
                  },
                ],
            }

  - name: "support"
    label: "Support"
    files:
      - name: "support"
        label: "Supporters"
        file: "src/content/support.md"
        format: "frontmatter"
        fields:
          - {
              label: "Title",
              name: "title",
              widget: "string",
              default: "Support",
            }
          - {
              label: "Friends",
              name: "friends",
              widget: "list",
              fields: [{ label: "Name", name: "name", widget: "string" }],
            }

  - name: "ideas"
    label: "Ideas"
    folder: "src/content/ideas"
    create: true
    slug: "{{date}}-{{slug}}"
    format: "frontmatter"
    summary: "{{pitch}} ({{originator}}, {{date}})"
    fields:
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          format: "YYYY-MM-DD",
          required: true,
        }
      - { label: "Pitch", name: "pitch", widget: "string", required: true, hint: "One-line title for the idea" }
      - { label: "Originator", name: "originator", widget: "string", required: true, hint: "Who came up with this?" }
      - { label: "Description", name: "description", widget: "text", required: true }
      - {
          label: "Data Source",
          name: "data",
          widget: "string",
          required: false,
          hint: "Links or names of datasets that could power this",
        }
      - {
          label: "Note",
          name: "note_text",
          widget: "string",
          required: false,
          hint: "Short display note for the ideas page",
        }
      - {
          label: "Show on Page",
          name: "show_on_page",
          widget: "boolean",
          default: true,
          hint: "Whether this idea is visible on /ideas",
        }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          options: ["", "WIP", "PUBLISHED"],
          default: "",
          required: false,
        }

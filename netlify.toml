[build]
  command = "pnpm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/.well-known/atproto-did"
  [headers.values]
    Content-Type = "text/plain"

[[headers]]
  for = "/.well-known/site.standard.publication"
  [headers.values]
    Content-Type = "text/plain"
